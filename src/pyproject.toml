[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wizbind"
version = "0.4.0"
description = "Offline WiZ AP, assisted pairing and local CLI/web control"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cryptography>=46,<47"]

[project.scripts]
wizbind = "wizbind.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["wizbind"]
